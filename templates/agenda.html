<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filnename='style.css') }}">
    <title>Agenda</title>
</head>
<style>
    * {
    padding: 0;
    margin: auto;
}

#lt {
    display: flex;
    justify-content: center;
    padding-top: 10px;
    margin-bottom: 0px;
    font-family: 'Courier New', Courier, monospace;
}

#lt::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -5px;
    width: 0;
    height: 2px;
    background-color: #000;
    transition: 0.3s ease;
}

#lt:hover::after {
    width: 100%;
}

#rt {
    margin-left: 230px;
    padding-top: 10px;
    margin-bottom: 0px;
    font-family: 'Courier New', Courier, monospace;
    list-style-type: circle;
}

#rt::before {
    content: "✔ ";
}

.botao-de-tarefas {
    margin-top: 15px;
    margin-bottom: 15px;
    padding: 10px 20px;
    background-color: #f44336;
    color: white;
    border: none;
    cursor: pointer;
    border: 1px solid #730705;
    border-radius: 15px;
    font-family: 'Courier New', Courier, monospace;
    height: 40px;
    transition: 0.5s;
}

.botao-de-tarefas:hover {
    background-color: #730705;
    height: 43px;
}

#botao {
    padding: 10px 20px;
    margin-top: 15px;
    background-color: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
    border: 1px solid #1a4f1c;
    border-radius: 15px;
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    height: 40px;
    transition: 0.5s;
    margin-top: 0;
}

#botao:hover {
    background-color: #1a4f1c;
    color: white;
    border: 1px solid #1a4f1c;
    height: 43px;
}

#limpar {
    padding: 10px 20px;
    margin-top: px;
    background-color: #f44336;
    color: white;
    border: none;
    cursor: pointer;
    border: 1px solid #730705;
    border-radius: 15px;
    font-family: 'Courier New', Courier, monospace;
    height: 40px;
    transition: 0.5s;
}

#limpar:hover {
    background-color: #730705;
    height: 43px;
}

input {
    border: none;
    box-shadow: 2px 3px 2px rgba(0, 0, 0, 0.2);
    border-radius: 20px;
    height: 30px;
    transition: 0.5s;
    padding-left: 10px;
}

input:hover {
    box-shadow: 3px 4px 3px rgba(0, 0, 0, 0.3);
    height: 33px;
}

#agenda {
    width: 320px;
    margin-top: 45px;
    border: 1px solid #1a4f1c;
    border-radius: 15px;
    padding: 5px;
    font-family: Arial, sans-serif;
    box-shadow: 2px 3px 2px rgba(0, 0, 0, 0.2);
    background-color: antiquewhite;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.botao-container {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    width: 100%; 
    justify-content: center;
}

#agenda > button {
    margin-left: 5px;
    margin-top: 0;
}

</style>
<body>
    <h1 id="lt">Lista de Tarefas</h1>
    <div id="agenda">
        <input id="tarefa" type="text" placeholder="Digite sua tarefa">
        <input type="date" id="data">
        <div class="botao-container">
            <button id="botao" onclick="adicionarTarefa()">Adicionar Tarefa</button>
            <button id="limpar" onclick="limparTarefas()">Limpar Tarefas</button>
        </div>
    </div>
    <p id="exibir"></p>
    <div id="lista-de-tarefas"></div>

    <script>
        let afazeres = JSON.parse(localStorage.getItem("afazeres")) || [];

        function salvarTarefas() {
            localStorage.setItem("afazeres", JSON.stringify(afazeres));
        }

        function adicionarTarefa() {
            const caixaDeTexto = document.getElementById("tarefa");
            const tarefa = caixaDeTexto.value.trim();
            const caixaDeData = document.getElementById("data");
            const data = caixaDeData.value;

            if (tarefa && data) {
                afazeres.push({
                    nome: tarefa,
                    id: Date.now().toString(),
                    data: data
                });

                salvarTarefas();
                renderizar();
                caixaDeTexto.value = '';
                caixaDeData.value = '';
            } else {
                alert("Por favor, insira uma tarefa e uma data válida.");
            }
        }

        function renderizar() {
            const listaDeTarefas = document.getElementById("lista-de-tarefas");
            listaDeTarefas.innerHTML = "";

            afazeres.forEach(function (tarefa) {
                const botao = document.createElement("button");
                botao.innerText = "Apagar";
                botao.style = "margin-left: 12px";
                botao.id = tarefa.id;
                botao.classList.add("botao-de-tarefas");
                botao.onclick = removerTarefas;

                const elemento = document.createElement("div");
                elemento.id = "rt";
                
                elemento.innerHTML = tarefa.nome + " - " + formatarData(tarefa.data);

                elemento.appendChild(botao);
                listaDeTarefas.appendChild(elemento);
            });
        }

        function removerTarefas(evento) {
            const botao = evento.target;
            const id = botao.id;

            afazeres = afazeres.filter(function (tarefa) {
                return tarefa.id !== id;
            });

            salvarTarefas();
            renderizar();
        }

        function formatarData(data) {
            if (!data) return "";

            const partes = data.split("-");
            if (partes.length !== 3) return data;

            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function limparTarefas() {
            afazeres = []; // Limpa todas as tarefas
            salvarTarefas(); // Atualiza o localStorage
            renderizar(); // Atualiza a interface
        }

        renderizar();
    </script>
</body>
</html>
